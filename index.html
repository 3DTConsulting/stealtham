<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stealth AM · Suivi des taux courts</title>
<meta name="description" content="Suivi quotidien des taux courts souverains (France, Allemagne, Italie, Espagne), calendrier des émissions et paysage des fonds monétaires en euros.">
<meta name="theme-color" content="#1f5f8b">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suivi taux">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : en-tête et sélecteur de langue, deux vues (taux et émissions / concurrence), panneaux empilés */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#16202c; --muted:#5b6675; --line:#dde1e7; --accent:#1f5f8b;
  --fr:#2f5fd0; --de:#b07a12; --it:#1e8a5a; --es:#c2413b;
  --ok:#1e7a4c; --warn:#a46a00; --bad:#b3362f; --okbg:#e3f3ea; --warnbg:#fbf0d9; --badbg:#f9e1df;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#171e27; --ink:#e6ebf1; --muted:#97a3b3; --line:#2a3440; --accent:#6aa9d8;
  --fr:#7c9ff0; --de:#e0a93f; --it:#4cc48d; --es:#ef7a72;
  --ok:#5fd396; --warn:#f0b54a; --bad:#f08a82; --okbg:#173326; --warnbg:#3a2d12; --badbg:#3d1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#171e27; --ink:#e6ebf1; --muted:#97a3b3; --line:#2a3440; --accent:#6aa9d8;
  --fr:#7c9ff0; --de:#e0a93f; --it:#4cc48d; --es:#ef7a72;
  --ok:#5fd396; --warn:#f0b54a; --bad:#f08a82; --okbg:#173326; --warnbg:#3a2d12; --badbg:#3d1d1b; color-scheme:dark}
html{color-scheme:light}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.page{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:flex;flex-direction:column;gap:28px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
header .hd{min-width:0;flex:1 1 520px}
header h1{font:700 1.7rem/1.15 var(--f-display);margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:68ch}
.eyebrow{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.run{font:500 .78rem var(--f-mono);color:var(--muted);margin-top:8px}
h2{font:700 1.1rem var(--f-display);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.92rem;max-width:80ch}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--c)}
.tile .ctry{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 1rem var(--f-display)}
.tile .big{font:500 1.6rem var(--f-mono);font-variant-numeric:tabular-nums}
.tile .big small{font-size:.8rem;color:var(--muted);margin-left:4px}
.tile .meta{font-size:.84rem;color:var(--muted)}
.tile .delta{font:500 .82rem var(--f-mono)}
.chip{font:500 .7rem var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.chart{width:100%;overflow-x:auto}
svg text{fill:var(--muted);font:11px var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.88rem;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:0;border-top:3px solid;display:inline-block}
.legend i.dash{border-top-style:dashed}
.legend i.dot{width:10px;height:10px;border-radius:50%;border:2px solid}
.legend i.sq{width:11px;height:11px;border:0;border-radius:2px;background:var(--c)}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:10px}
.controls label,.tool label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);min-width:0}
select,input{font:15px var(--f-mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button,.seg button{font:600 .9rem var(--f-body);border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg.lang button{font:500 .8rem var(--f-mono);padding:5px 10px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
td.r,th.r{text-align:right}
td.txt{white-space:normal;min-width:200px;max-width:320px}
td.yc{min-width:170px;max-width:220px;white-space:normal}
td .sm{display:block;font-size:.8rem;color:var(--muted);margin-top:2px;white-space:normal}
td details{margin-top:4px;font-size:.8rem;color:var(--muted)}
td details summary{cursor:pointer;color:var(--accent);list-style:none;display:inline}
td details summary::-webkit-details-marker{display:none}
td details summary::before{content:"+ "}
td details[open] summary::before{content:"− "}
td details p{margin:4px 0 0;max-width:46ch}
.note{font-size:.84rem;color:var(--muted);margin-top:10px;max-width:80ch}
.tool{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.result{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.result div{border-left:3px solid var(--sev,var(--line));padding-left:10px}
.result b{display:block;font:500 1.15rem var(--f-mono);font-variant-numeric:tabular-nums}
.result span{font-size:.8rem;color:var(--muted)}
ul.src{margin:0;padding-left:18px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
a{color:var(--accent)}
.views{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:-8px}
.views button{font:600 .98rem var(--f-display);background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer}
.views button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.view{display:flex;flex-direction:column;gap:28px}
.view[hidden]{display:none!important}
th.sort{cursor:pointer}
th.sort[aria-sort]::after{content:" ▾";color:var(--accent)}
th.sort[aria-sort="ascending"]::after{content:" ▴"}
.cat{display:inline-flex;align-items:center;gap:6px}
.cat i{width:9px;height:9px;border-radius:2px;background:var(--c);display:inline-block;flex:none}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.9rem;cursor:pointer}
label.chk input{width:auto;accent-color:var(--accent)}
.week{font:500 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px;border-bottom:1px solid var(--line)}
.ev{display:grid;grid-template-columns:92px 120px minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.ev .d{font:500 .88rem var(--f-mono);font-variant-numeric:tabular-nums}
.ev .c{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
.ev .c i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.ev .t b{font-weight:600}
.ev .t span{display:block;font-size:.84rem;color:var(--muted)}
.ev .v{font:500 .86rem var(--f-mono);text-align:right;white-space:nowrap}
.ev .tags{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.ev.today{background:linear-gradient(90deg,var(--okbg),transparent 60%)}
@media (max-width:640px){.ev{grid-template-columns:80px minmax(0,1fr)}.ev .c{grid-column:2}.ev .t{grid-column:1/-1}.ev .v{grid-column:1/-1;text-align:left}.ev .tags{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">
<header>
  <div class="hd">
    <div class="eyebrow" data-i="eyebrow"></div>
    <h1 data-i="h1"></h1>
    <p data-i="intro"></p>
    <div class="run" id="run"></div>
  </div>
  <div class="seg lang" id="lang" role="group" aria-label="Langue / Language">
    <button type="button" data-l="fr" aria-pressed="true">FR</button>
    <button type="button" data-l="en" aria-pressed="false">EN</button>
  </div>
</header>
<nav class="views" role="tablist">
  <button type="button" role="tab" id="t-taux" aria-selected="true" aria-controls="v-taux" data-i="tab_rates"></button>
  <button type="button" role="tab" id="t-comp" aria-selected="false" aria-controls="v-comp" data-i="tab_comp"></button>
</nav>

<div id="v-taux" class="view">
<section>
  <h2 data-i="tiles_h"></h2>
  <p class="sub" data-i="tiles_sub"></p>
  <div class="tiles" id="tiles"></div>
</section>

<section class="panel">
  <h2 data-i="curve_h"></h2>
  <p class="sub" data-i="curve_sub"></p>
  <div class="controls"><label for="cmp"><span data-i="cmp_label"></span><select id="cmp"></select></label></div>
  <div class="chart" id="chart"></div>
  <div class="legend" id="legend"></div>
</section>

<section class="panel">
  <h2 data-i="hist_h"></h2>
  <p class="sub" data-i="hist_sub"></p>
  <div class="controls"><div class="seg" id="range" role="group"></div></div>
  <div class="chart" id="hist"></div>
  <div class="legend" id="hlegend"></div>
</section>

<section class="panel">
  <h2 data-i="cal_h"></h2>
  <p class="sub" data-i="cal_sub"></p>
  <div class="controls">
    <div class="seg" id="calv" role="group"></div>
    <div class="seg" id="calc" role="group"></div>
    <div class="seg" id="calh" role="group"></div>
    <label class="chk" for="calshort"><input type="checkbox" id="calshort" checked> <span data-i="cal_short"></span></label>
  </div>
  <div id="cal"></div>
  <div class="legend" id="callegend"></div>
  <p class="note" id="calnote"></p>
</section>

<section class="panel">
  <h2 data-i="table_h"></h2>
  <p class="sub" data-i="table_sub"></p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="tbl" id="table"></div>
  <p class="note" id="tnote"></p>
</section>

<section class="panel">
  <h2 data-i="tool_h"></h2>
  <p class="sub" data-i="tool_sub"></p>
  <form class="tool" id="tool">
    <label for="isin"><span data-i="tool_line"></span><select id="isin"></select></label>
    <label for="px"><span data-i="tool_px"></span><input id="px" inputmode="decimal" autocomplete="off"></label>
    <label for="side"><span data-i="tool_side"></span><select id="side"><option value="buy" data-i="buy"></option><option value="sell" data-i="sell"></option></select></label>
  </form>
  <div class="result" id="result"></div>
  <p class="note" data-i="tool_note"></p>
</section>

<section class="panel">
  <h2 data-i="src_h"></h2>
  <ul class="src" data-i="src_list"></ul>
  <p class="note" data-i="src_note"></p>
</section>
</div>

<div id="v-comp" class="view" hidden>
<section>
  <h2 data-i="c_h"></h2>
  <p class="sub" data-i="c_sub"></p>
  <div class="tiles" id="ctiles"></div>
</section>
<section class="panel">
  <h2 data-i="cc_h"></h2>
  <p class="sub" data-i="cc_sub"></p>
  <div class="controls">
    <div class="seg" id="ccat" role="group"></div>
    <label for="ctype"><span data-i="c_type"></span><select id="ctype"></select></label>
  </div>
  <div class="chart" id="cchart"></div>
</section>
<section class="panel">
  <h2 data-i="ct_h"></h2>
  <p class="sub" data-i="ct_sub"></p>
  <div class="tbl" id="ctable"></div>
</section>
<section class="panel">
  <h2 data-i="tk_h"></h2>
  <p class="sub" data-i="tk_sub"></p>
  <div class="tbl" id="ttable"></div>
  <p class="note" id="mnote"></p>
</section>
</div>
</div>

const t=k=>D[LANG][k];
const CN={fr:{FR:"France",DE:"Allemagne",IT:"Italie",ES:"Espagne"},en:{FR:"France",DE:"Germany",IT:"Italy",ES:"Spain"}};
const C={FR:{color:"--fr"},DE:{color:"--de"},IT:{color:"--it"},ES:{color:"--es"}};
const cn=k=>CN[LANG][k];
// traductions des libellés de données connus (sources des relevés)
const TRD={"Bundesbank, prix de référence":"Bundesbank, reference prices","Borsa Italiana (MOT), dernier cours":"Borsa Italiana (MOT), last price",
"Adjudication BTF (source secondaire)":"BTF auction (secondary source)","Adjudication Letras (source secondaire)":"Letras auction (secondary source)",
"relevé à 9 h 55, peut inclure des cours de la veille":"captured at 9:55 am, may include previous-day prices","relevé après la clôture de 17 h 30":"captured after the 5:30 pm close",
"taux moyens pondérés":"weighted average rates","taux marginaux":"marginal rates"};
const tr=s=>LANG==="en"&&s&&TRD[s]?TRD[s]:(s||"");
const pick=(o,k)=>LANG==="en"&&o&&o[k+"_en"]?o[k+"_en"]:(o?o[k]:"");

// ---------- Utilitaires ----------
const ORDER=["FR","DE","IT","ES"];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const day=s=>new Date(s+"T00:00:00Z");
const todayISO=()=>{const d=new Date();return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())).toISOString().slice(0,10);};
const addBD=(s,n)=>{const d=day(s);while(n>0){d.setUTCDate(d.getUTCDate()+1);const w=d.getUTCDay();if(w&&w<6)n--;}return d;};
const days=(a,b)=>Math.round((b-a)/864e5);
const fmtD=s=>s?s.split("-").reverse().join("/"):"";
const fmtAD=s=>!s?"":s.length===7?s.slice(5)+"/"+s.slice(0,4):fmtD(s);
const dec=(v,d)=>LANG==="fr"?v.toFixed(d).replace(".",","):v.toFixed(d);
const pct=v=>LANG==="fr"?dec(v,2)+" %":dec(v,2)+"%";
const nfr=(v,d=3)=>dec(v,d);
const loc=()=>LANG==="fr"?"fr-FR":"en-GB";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const signed=v=>(v>=0?"+":"")+dec(v,1);

let SNAPS=[], SERIES={}, META=null, RANGE="6M", TAB="DE", DBSTATE="loading";

function prep(s){
  const lines=(s.lines||[]).map(l=>{
    const o={...l};
    if(s.kind==="isin"){
      o.days=days(addBD(s.date,2),day(l.maturity));
      if(typeof l.yield!=="number" && typeof l.price==="number" && o.days>0) o.yield=(100/l.price-1)*360/o.days*100;
    }
    return o;
  }).filter(l=>typeof l.yield==="number"&&isFinite(l.yield));
  return {...s,lines};
}
const pts=s=>s.lines.filter(l=>l.days>3).map(l=>({x:l.days,y:l.yield,id:l.isin||l.label}));
const near1y=s=>{const p=pts(s);return p.length?p.reduce((a,b)=>Math.abs(b.x-365)<Math.abs(a.x-365)?b:a):null;};
function byCountry(){const m={};for(const s of SNAPS){(m[s.country]=m[s.country]||[]).push(s);}for(const k in m)m[k].sort((a,b)=>a.date<b.date?-1:1);return m;}
function status(s){const n=days(day(s.date),day(todayISO()));if(s.kind==="auction")return n>20?["bad",t("oldAuction")]:["warn",t("auctionRef")];return n>5?["warn",t("staleN")(n)]:["ok",t("upToDate")];}
const empty=msg=>`<div class="empty">${msg}</div>`;

// ---------- Vue taux ----------
function renderRun(){
  const el=document.getElementById("run");
  if(DBSTATE!=="ok"){el.textContent=t(DBSTATE==="loading"?"loading":DBSTATE);return;}
  if(!SNAPS.length){el.textContent=t("noData");return;}
  const note=META?(LANG==="en"&&META.note_en?META.note_en:META.note):"";
  el.textContent=META?.lastRun?t("lastRun")(fmtD(META.lastRun.slice(0,10)),META.lastRun.slice(11,16),note):t("nSnaps")(SNAPS.length);
}
function deltaHtml(d,dt){return `<div class="delta" style="color:var(${d>0.5?'--bad':d<-0.5?'--ok':'--muted'})">${t("since")(signed(d),dt)}</div>`;}
function renderTiles(){
  const m=byCountry(), el=document.getElementById("tiles");
  if(!SNAPS.length){el.innerHTML=empty(t("emptyTiles"));return;}
  el.innerHTML="";
  for(const k of ORDER){
    const tec=k==="FR"?SERIES["FR-tec"]?.tenors?.["1Y"]:null;
    const tile=document.createElement("div");tile.className="tile";tile.style.setProperty("--c",`var(${C[k].color})`);
    if(tec?.length){
      const L=tec[tec.length-1], P=tec.length>1?tec[tec.length-2]:null;
      const n=days(day(L[0]),day(todayISO())), st=n>5?["warn",t("staleN")(n)]:["ok",t("upToDate")];
      tile.innerHTML=`<div class="ctry">${cn(k)}<span class="chip ${st[0]}">${st[1]}</span></div>
        <div class="big">${pct(L[1])}<small>${t("oneY")}</small></div>${P?deltaHtml((L[1]-P[1])*100,fmtD(P[0])):""}
        <div class="meta">${t("tecSrc")} · ${t("at")} ${fmtD(L[0])}</div>`;
      el.appendChild(tile); continue;
    }
    const arr=m[k]; if(!arr) continue;
    const s=arr[arr.length-1], p=near1y(s); if(!p) continue;
    const prev=arr.length>1?near1y(arr[arr.length-2]):null;
    const [cls,txt]=status(s);
    tile.innerHTML=`<div class="ctry">${cn(k)}<span class="chip ${cls}">${txt}</span></div>
      <div class="big">${pct(p.y)}<small>${Math.round(p.x/30.4)} ${t("months")}</small></div>${prev?deltaHtml((p.y-prev.y)*100,fmtD(arr[arr.length-2].date)):""}
      <div class="meta">${esc(tr(s.source))} · ${t("at")} ${fmtD(s.date)}</div>`;
    el.appendChild(tile);
  }
}
function fillCompare(){
  const sel=document.getElementById("cmp"), cur=sel.value;
  const latest={}; for(const [k,a] of Object.entries(byCountry())) latest[k]=a[a.length-1].date;
  const dates=[...new Set(SNAPS.filter(s=>s.kind==="isin"&&s.date<latest[s.country]).map(s=>s.date))].sort().reverse();
  sel.innerHTML=`<option value="">${t("noCmp")}</option>`+dates.map(d=>`<option value="${d}">${fmtD(d)}</option>`).join("");
  sel.value=dates.includes(cur)?cur:"";
}
function yTicks(ymin,ymax,step,X0,X1,Y){let s="";for(let v=Math.ceil(ymin/step-1e-9)*step;v<=ymax+1e-9;v+=step){s+=`<line x1="${X0}" x2="${X1}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css('--line')}"/><text x="${X0-8}" y="${Y(v)+4}" text-anchor="end">${dec(v,2)}</text>`;}return s;}
function drawCurve(){
  const host=document.getElementById("chart");
  if(!SNAPS.length){host.innerHTML=empty(t("emptyCurve"));document.getElementById("legend").innerHTML="";return;}
  const m=byCountry(), cmp=document.getElementById("cmp").value;
  const W=900,H=360,mg={l:52,r:20,t:16,b:40},xmax=460;
  const series=[];
  for(const k of ["DE","IT","FR","ES"]){const a=m[k];if(!a)continue;series.push({k,s:a[a.length-1],past:false});
    if(cmp){const p=a.filter(s=>s.kind==="isin"&&s.date<=cmp).pop();if(p&&p!==a[a.length-1])series.push({k,s:p,past:true});}}
  const all=series.flatMap(o=>pts(o.s).filter(p=>p.x<=xmax));
  if(!all.length){host.innerHTML="";return;}
  const ymin=Math.floor(Math.min(...all.map(p=>p.y))*4)/4-.25, ymax=Math.ceil(Math.max(...all.map(p=>p.y))*4)/4+.25;
  const X=v=>mg.l+v/xmax*(W-mg.l-mg.r), Y=v=>H-mg.b-(v-ymin)/(ymax-ymin)*(H-mg.t-mg.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px" role="img" aria-label="${esc(S[LANG].curve_h)}">`+yTicks(ymin,ymax,.25,mg.l,W-mg.r,Y);
  for(const mo of [0,3,6,9,12,15]) s+=`<text x="${X(mo*30.4)}" y="${H-mg.b+18}" text-anchor="middle">${mo} ${t("mo")}</text>`;
  s+=`<text x="${(W+mg.l)/2}" y="${H-6}" text-anchor="middle">${t("resMat")}</text><text x="14" y="${(H-mg.b)/2}" transform="rotate(-90 14 ${(H-mg.b)/2})" text-anchor="middle">${t("yieldPct")}</text>`;
  for(const o of series){
    const col=css(C[o.k].color), ps=pts(o.s).filter(p=>p.x<=xmax).sort((a,b)=>a.x-b.x), isin=o.s.kind==="isin";
    if(ps.length>1) s+=`<polyline fill="none" stroke="${col}" stroke-width="${o.past?1.5:2}" opacity="${o.past?.6:1}" ${(!isin||o.past)?'stroke-dasharray="5 4"':''} points="${ps.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>`;
    if(!o.past) for(const p of ps) s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${isin?3.5:5}" fill="${isin?col:css('--surface')}" stroke="${col}" stroke-width="2"><title>${cn(o.k)} · ${esc(p.id)} · ${p.x} ${t("dShort")} · ${pct(p.y)} · ${fmtD(o.s.date)}</title></circle>`;
  }
  host.innerHTML=s+"</svg>";
  document.getElementById("legend").innerHTML=series.filter(o=>!o.past).map(o=>`<span><i class="${o.s.kind==='auction'?'dot':''}" style="border-color:var(${C[o.k].color})"></i>${cn(o.k)} · ${fmtD(o.s.date)}</span>`).join("")+(cmp?`<span><i class="dash" style="border-color:var(--muted)"></i>${t("snapOf")(fmtD(cmp))}</span>`:"");
}
function drawHist(){
  const host=document.getElementById("hist");
  const lines=[], dots=[];
  const sv=SERIES["DE-svensson"]?.tenors||{}, tec=SERIES["FR-tec"]?.tenors||{};
  if(sv["1Y"]?.length) lines.push({k:"DE",label:t("deSv1"),data:sv["1Y"],dash:false});
  if(sv["2Y"]?.length) lines.push({k:"DE",label:t("deSv2"),data:sv["2Y"],dash:true});
  if(tec["1Y"]?.length) lines.push({k:"FR",label:t("frT1"),data:tec["1Y"],dash:false});
  if(tec["2Y"]?.length) lines.push({k:"FR",label:t("frT2"),data:tec["2Y"],dash:true});
  const m=byCountry();
  for(const k of ["IT","FR","ES"].filter(k=>!(k==="FR"&&tec["1Y"]?.length))){const a=m[k];if(!a)continue;const d=a.map(s=>{const p=near1y(s);return p?[s.date,p.y]:null;}).filter(Boolean);if(d.length)(d.length>1&&k==="IT"?lines:dots).push({k,label:t("approx1y")(cn(k),k==="IT"?t("motSnaps"):t("auctions")),data:d,dash:false});}
  if(!lines.length&&!dots.length){host.innerHTML=empty(t("emptyHist"));document.getElementById("hlegend").innerHTML="";return;}
  const end=todayISO(), back={"1M":31,"3M":92,"6M":183,"1A":366}[RANGE];
  const start=new Date(day(end)-back*864e5).toISOString().slice(0,10);
  const inR=d=>d.filter(p=>p[0]>=start&&p[0]<=end);
  const allY=[...lines,...dots].flatMap(o=>inR(o.data).map(p=>p[1]));
  if(!allY.length){host.innerHTML=empty(t("noPeriod"));return;}
  const W=900,H=320,mg={l:52,r:20,t:16,b:36};
  const ymin=Math.floor(Math.min(...allY)*4)/4-.1, ymax=Math.ceil(Math.max(...allY)*4)/4+.1;
  const t0=day(start),t1=day(end);
  const X=d=>mg.l+(day(d)-t0)/(t1-t0)*(W-mg.l-mg.r), Y=v=>H-mg.b-(v-ymin)/(ymax-ymin)*(H-mg.t-mg.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px" role="img" aria-label="${esc(S[LANG].hist_h)}">`+yTicks(ymin,ymax,(ymax-ymin)>1.2?.5:.25,mg.l,W-mg.r,Y);
  const d=new Date(t0);d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+1);

  // tableau des fonds tokenisés : structure et blockchains sous le nom du produit
  const TH=t("tth"), tk=tok.slice().sort((a,b)=>(a.currency==="EUR"?0:1)-(b.currency==="EUR"?0:1)||((b.aum_m??-1)-(a.aum_m??-1)));
  document.getElementById("ttable").innerHTML=tk.length?`<table><thead><tr><th>${TH.manager}</th><th>${TH.fund}</th><th>${TH.token}</th><th>${TH.cur}</th><th class="r">${TH.aum}</th><th>${TH.date}</th><th class="r">${TH.yld}</th><th>${TH.src}</th></tr></thead><tbody>`+
    tk.map(f=>{const ch=Array.isArray(f.chains)?f.chains.join(", "):(f.chains||"");const dom=pick(f,"domicile");
      return `<tr><td class="txt">${esc(f.manager)}</td><td class="txt"><b style="font-weight:600">${esc(f.fund)}</b>${dom||ch?`<span class="sm">${esc(dom)}${dom&&ch?" · ":""}${esc(ch)}</span>`:""}${det(f)}</td><td class="num">${esc(f.token||"")}</td><td>${f.currency==="EUR"?`<span class="chip ok">EUR</span>`:esc(f.currency||"")}</td><td class="r num">${mm(f.aum_m,f.currency)}</td><td class="num">${fmtAD(f.aum_date)}</td>${yld(f)}<td>${f.source_url?`<a href="${esc(f.source_url)}" target="_blank" rel="noopener">${t("link")}</a>`:""}</td></tr>`;}).join("")+"</tbody></table>":empty(t("noTok"));
  document.getElementById("mnote").innerHTML=[mk?t("mkt")(esc(pick(mk,"note")),esc(mk.source_url)):"",t("listNote")(fmtD(COMP.europe?.updated||COMP.tokenized?.updated||""))].filter(Boolean).join("<br>");
}
document.getElementById("ctable").addEventListener("click",e=>{const th=e.target.closest("th.sort");if(!th)return;const k=th.dataset.k;CSORT=CSORT.k===k?{k,dir:-CSORT.dir}:{k,dir:(k==="aum_bn_eur"||k==="yield_pct")?-1:1};renderComp();});

// ---------- Langue : application ----------
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=S[LANG][el.dataset.i];if(v!=null)el.innerHTML=v;});
  [...document.getElementById("lang").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===LANG));
  buildRange();buildCalControls();buildComp();renderAll();renderComp();
}
document.getElementById("lang").addEventListener("click",e=>{const b=e.target.closest("button[data-l]");if(!b||b.dataset.l===LANG)return;LANG=b.dataset.l;try{localStorage.setItem("lang",LANG)}catch(err){}applyLang();});

function renderAll(){renderRun();renderTiles();fillCompare();drawCurve();drawHist();renderTable();fillTool();renderCal();}
applyLang();
if(location.hash==="#concurrence")showView("concurrence");
window.addEventListener("hashchange",()=>showView(location.hash==="#concurrence"?"concurrence":"taux"));
const redraw=()=>{drawCurve();drawHist();renderCal();renderComp();};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

// ---------- Données : fichiers JSON publiés avec l'application ----------
async function loadJSON(n){const r=await fetch(`data/${n}.json?t=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw new Error(n+" "+r.status);return r.json();}
async function loadAll(){
  try{
    const [snaps,series,comp,cal,status]=await Promise.all(["snapshots","series","competitors","calendar","status"].map(loadJSON));
    DBSTATE="ok";
    SNAPS=Object.values(snaps).map(prep).filter(s=>s.country&&s.date&&s.lines.length);
    SERIES=series;COMP=comp;CAL={};for(const [k,v] of Object.entries(cal))if(v&&v.country)CAL[k]=v;META=status;
    renderAll();renderComp();
  }catch(e){DBSTATE="readFail";renderRun();console.error(e);}
}
loadAll();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadAll();});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
